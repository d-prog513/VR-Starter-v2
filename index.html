<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Descent VR - Wrist Lab v6.2.10</title>
<script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
}

#hud {
  position: fixed;
  left: 12px;
  top: 12px;
  z-index: 10;
  background: #101a29df;
  color: white;
  padding: 12px;
  border-radius: 8px;
  font-size: 14px;
  pointer-events: none;
  max-width: 340px;
  white-space: pre-line;
}

#crosshair {
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  z-index: 9;
  color: white;
  pointer-events: none;
  font-size: 22px;
}

body.immersive #hud,
body.immersive #crosshair {
  display: none;
}

#audio-panel {
  position: fixed; bottom: 12px; left: 12px; z-index: 20;
  background: #101a29ef; color: white; border-radius: 8px;
  padding: 10px; font: 14px Arial, sans-serif;
}
#audio-panel button { margin-left: 5px; padding: 7px; cursor: pointer; }
body.immersive #audio-panel { display: none; }


#mobile-controls { display:none; position:fixed; inset:0; z-index:15; pointer-events:none; user-select:none; -webkit-user-select:none; --stick-size:clamp(88px,27vw,120px); }
body.input-touch:not(.immersive) #mobile-controls { display:block; }
#mobile-controls button, #touch-move, #touch-look { pointer-events:auto; touch-action:none; -webkit-tap-highlight-color:transparent; }
#touch-look { position:absolute; inset:0 0 0 39%; z-index:0; }
#touch-move { position:absolute; left:12px; bottom:calc(24px + env(safe-area-inset-bottom,0px)); width:var(--stick-size); height:var(--stick-size); z-index:2; border:2px solid #a9d9ef88; border-radius:50%; background:#172c407a; display:grid; place-items:center; color:#c4dce988; font:10px Arial,sans-serif; box-sizing:border-box; }
#touch-move i { position:absolute; width:38%; height:38%; border:1px solid #d5f4ffbb; border-radius:50%; background:#76b8d588; box-sizing:border-box; }
#touch-actions { position:absolute; inset:0; pointer-events:none; z-index:2; }
#touch-actions button { position:absolute; padding:4px; color:#f4fbff; background:#193b52db; border:2px solid #bddcea99; border-radius:50%; font:bold 11px Arial,sans-serif; box-shadow:0 2px 8px #0005; }
#touch-actions button[data-action="primary"] { right:16px; bottom:calc(108px + env(safe-area-inset-bottom,0px)); width:76px; height:76px; background:#216b87e6; border-color:#94e7ff; }
#touch-actions button[data-action="secondary"] { right:25px; bottom:calc(200px + env(safe-area-inset-bottom,0px)); width:58px; height:58px; font-size:9px; }
#touch-actions button[data-action="jump"] { right:20px; bottom:calc(24px + env(safe-area-inset-bottom,0px)); width:64px; height:64px; }
#touch-actions button[data-action="sprint"] { left:16px; bottom:calc(var(--stick-size) + 40px + env(safe-area-inset-bottom,0px)); width:82px; height:38px; border-radius:20px; font-size:10px; }
#touch-actions button.active { background:#337b48e8; border-color:#b5f1bf; }
#touch-actions button.aiming { background:#388dadf2; box-shadow:0 0 0 5px #9beaff33; }
#touch-actions button:disabled { opacity:0.5; }
#touch-hotbar { position:absolute; bottom:calc(20px + env(safe-area-inset-bottom,0px)); left:50%; transform:translateX(-50%); z-index:3; display:flex; gap:6px; padding:5px; border:1px solid #a3c3d666; border-radius:10px; background:#102434bf; }
#touch-hotbar button { width:clamp(46px,13vw,64px); min-height:44px; border:2px solid #7894a8; border-radius:6px; background:#263f53; color:#e5f2fa; font:bold 9px Arial,sans-serif; padding:3px; }
#touch-hotbar button[aria-pressed="true"] { border-color:#a6efff; background:#2c7188; box-shadow:inset 0 0 0 1px #b7f3ff; }
#touch-hotbar button:disabled { opacity:0.6; }
#touch-status { position:absolute; top:12px; left:12px; right:94px; z-index:1; color:#effaff; text-shadow:0 1px 3px #000; font:11px Arial,sans-serif; pointer-events:none; }
body.input-touch #hud { display:none; }
body.input-touch .a-enter-vr { top:58px; bottom:auto; right:calc(50% + 5px); }
body.input-touch .a-enter-ar { top:58px; bottom:auto; right:calc(50% - 55px); }
@media (max-height:450px) {
  #mobile-controls { --stick-size:100px; }
  #touch-move { bottom:16px; }
  #touch-actions button[data-action="primary"] { bottom:94px; width:70px; height:70px; }
  #touch-actions button[data-action="secondary"] { right:102px; bottom:104px; width:52px; height:52px; }
  #touch-actions button[data-action="jump"] { bottom:16px; width:60px; height:60px; }
  #touch-actions button[data-action="sprint"] { bottom:132px; }
  #touch-hotbar { bottom:16px; }
}

#audio-panel { display:none !important; }
#pause-launcher { position:fixed; top:10px; right:10px; z-index:25; padding:10px 18px; color:white; background:#22455e; border:1px solid #70c6e8; border-radius:8px; }
body.immersive #pause-launcher { display:none; }
#pause-overlay { display:none; position:fixed; inset:0; z-index:50; background:#06111cce; place-items:center; color:#edf8ff; font:14px Arial,sans-serif; }
#pause-overlay section { width:min(90vw,600px); max-height:90vh; overflow:auto; background:#152d42; border:1px solid #6597b4; border-radius:12px; padding:16px; box-sizing:border-box; }
#pause-overlay h2 { margin:0 0 12px; }
#pause-info { white-space:pre-line; }
#pause-actions { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
#pause-actions button { min-height:42px; background:#294c69; color:white; border:1px solid #6c9fbd; border-radius:7px; touch-action:manipulation; }
#pause-help { white-space:pre-wrap; font:12px/1.5 Arial,sans-serif; }
body.game-paused #mobile-controls { display:none !important; }


#input-layout-settings { margin:14px 0 0; border:1px solid #6597b4; border-radius:7px; padding:10px; }
#input-layout-settings button { margin:4px 6px 4px 0; min-height:38px; padding:6px 12px; border:1px solid #6c9fbd; border-radius:6px; background:#294c69; color:white; touch-action:manipulation; }
#input-layout-settings button[aria-pressed="true"] { background:#367449; border-color:#a4ebaa; }
#input-layout-settings p { margin:6px 0 0; font-size:12px; line-height:1.4; }
</style>

<script>
AFRAME.registerComponent('training-v4', {
  init: function () {
    const $ = selector => document.querySelector(selector);

    this.rig = $('#rig');
    this.view = $('#view');
    this.target = $('#target');
    this.label = $('#health');
    this.hud = $('#hud');
    this.vrhud = $('#vrhud');
    this.left = $('#left');
    this.right = $('#right');

    this.keys = new Set();
    this.axes = {x: 0, y: 0, turn: 0};

    this.mode = 'smooth';
    this.snapReady = true;
    // Single fixed values preserve the existing movement and ledge interface.
    this.turnIndex = 0;
    this.walkIndex = 0;
    this.turnSpeeds = [105];
    this.walkSpeeds = [2.3];

    this.grip = false;
    this.stamina = 100;
    this.exhausted = false;
    this.velocityY = 0;
    this.grounded = true;

    this.hp = 100;
    this.resetAt = 0;
    this.flashAt = 0;
    this.placeAt = 0;
    this.nextClick = 0;
    this.lastHUD = '';

    this.head = new THREE.Vector3();
    this.after = new THREE.Vector3();
    this.forward = new THREE.Vector3();
    this.side = new THREE.Vector3();
    this.center = new THREE.Vector3();
    this.q = new THREE.Quaternion();

    this.ray = new THREE.Ray();
    this.hitPoint = new THREE.Vector3();
    this.sphere = new THREE.Sphere(
      new THREE.Vector3(),
      0.18
    );

    this.hands = [this.left, this.right].map(el => ({
      el: el,
      previous: new THREE.Vector3(),
      world: new THREE.Vector3(),
      ready: false,
      connected: false,
      inside: true,
      nextHit: 0
    }));

    this.left.addEventListener('thumbstickmoved', event => {
      this.axes.x = event.detail.x;
      this.axes.y = event.detail.y;
    });

    this.right.addEventListener('thumbstickmoved', event => {
      this.axes.turn = event.detail.x;
    });

    this.left.addEventListener('xbuttondown', () => {
      this.mode = this.mode === 'smooth' ? 'snap' : 'smooth';
      this.snapReady = false;
    });

    this.right.addEventListener('abuttondown', () => {
      if (this.inVR()) this.jump();
    });

    this.left.addEventListener('thumbstickdown', () => {
      if (this.inVR()) {
        this.grip = !this.grip;
      }
    });

    this.hands.forEach(hand => {
      hand.el.addEventListener('controllerconnected', () => {
        hand.connected = true;
        hand.ready = false;
      });

      hand.el.addEventListener('controllerdisconnected', () => {
        hand.connected = false;
        hand.ready = false;
        this.clearInput();
      });
    });

    const supported = [
      'KeyW',
      'KeyA',
      'KeyS',
      'KeyD',
      'Space',
      'ShiftLeft',
      'ShiftRight',
      'KeyP',
      'ArrowLeft',
      'ArrowRight',
      'ArrowUp',
      'ArrowDown'
    ];

    window.addEventListener('keydown', event => {
      if (this.inVR()) return;
      if (!supported.includes(event.code)) return;

      if (
        event.target.closest &&
        (event.target.closest('input,textarea,[contenteditable]') ||
          (event.code.startsWith('Arrow') && event.target.closest('button,select,a[href]')))
      ) {
        return;
      }

      event.preventDefault();
      this.keys.add(event.code);

      if (event.repeat) return;

      if (event.code === 'Space') this.jump();

    });

    window.addEventListener('keyup', event => {
      this.keys.delete(event.code);
    });

    window.addEventListener('blur', () => {
      this.clearInput();
    });

    document.addEventListener('visibilitychange', () => {
      this.clearInput();
    });

    document.addEventListener('pointerlockchange', () => {
      this.clearInput();
    });

    this.el.addEventListener('enter-vr', () => {
      document.body.classList.add('immersive');
      this.clearInput();
      this.landReset();
      this.placeAt = performance.now() + 1000;

      const session = this.el.renderer.xr.getSession();

      if (session) {
        session.addEventListener('visibilitychange', () => {
          this.clearInput();
        });
      }
    });

    this.el.addEventListener('exit-vr', () => {
      document.body.classList.remove('immersive');
      this.clearInput();
      this.landReset();
      this.placeAt = performance.now() + 200;
    });

    const bindCanvas = () => {
      if (this.canvasBound || !this.el.canvas) return;

      this.canvasBound = true;

      this.el.canvas.addEventListener('mousedown', event => {
        if (this.inVR() || event.button !== 0) return;
        this.desktopPunch();
      });
    };

    bindCanvas();

    this.el.addEventListener(
      'render-target-loaded',
      bindCanvas
    );

    this.placeAt = performance.now() + 600;
  },

  inVR: function () {
    return this.el.is('vr-mode');
  },

  stepKeyboardLook: function (dt) {
    const pause = this.el.components['pause-menu'];
    if (this.inVR() || document.hidden || (pause && pause.opened) ||
        !Number.isFinite(dt) || dt <= 0 || dt > 0.1) return;
    const look = this.view.components['look-controls'];
    if (!look || !look.yawObject || !look.pitchObject) return;
    const yaw = Number(this.keys.has('ArrowLeft')) - Number(this.keys.has('ArrowRight'));
    const pitch = Number(this.keys.has('ArrowUp')) - Number(this.keys.has('ArrowDown'));
    look.yawObject.rotation.y += yaw * (Math.PI / 2) * dt;
    const limit = 85 * Math.PI / 180;
    look.pitchObject.rotation.x = THREE.MathUtils.clamp(
      look.pitchObject.rotation.x + pitch * (Math.PI / 3) * dt, -limit, limit);
  },

  clearInput: function () {
    this.keys.clear();
    this.axes.x = 0;
    this.axes.y = 0;
    this.axes.turn = 0;
    this.grip = false;
    this.snapReady = true;

    this.hands.forEach(hand => {
      hand.ready = false;
    });
  },

  landReset: function () {
    this.rig.object3D.position.y = 0;
    this.velocityY = 0;
    this.grounded = true;
  },

    jump: function () {
    if (document.hidden) return;

    const climbing = this.el.components['ledge-climb'];

    // A while gripping becomes a ledge launch.
    if (
      this.inVR() &&
      climbing &&
      climbing.hands.some(hand => hand.grabbing)
    ) {
      climbing.launch(this);
      return;
    }

    // Otherwise, keep the ordinary ground jump.
    if (this.grounded) {
      this.velocityY = 4.2;
      this.grounded = false;
    }
  },
  
  placeTarget: function () {
    this.view.object3D.getWorldPosition(this.head);
    this.view.object3D.getWorldQuaternion(this.q);

    this.forward.set(0, 0, -1).applyQuaternion(this.q);
    this.forward.y = 0;

    if (this.forward.lengthSq() < 0.01) {
      this.forward.set(0, 0, -1);
    }

    this.forward.normalize();

    this.center.copy(this.head)
      .addScaledVector(this.forward, 0.65);

    this.center.y = this.head.y - 0.20;

    this.target.object3D.position.copy(this.center);
    this.label.object3D.position.copy(this.center);
    this.label.object3D.position.y += 0.30;

    this.hp = 100;
    this.resetAt = 0;
    this.flashAt = 0;

    this.target.setAttribute('color', '#26C6DA');
    this.label.setAttribute('value', 'HP 100 / 100');

    this.hands.forEach(hand => {
      hand.ready = false;
      hand.inside = true;
      hand.nextHit = performance.now() + 500;
    });
  },

  damage: function (amount = 20, source) {
    if (this.resetAt) return;

    this.hp = Math.max(0, this.hp - amount);
    const feedback = this.el.components['ability-test'];
    if (feedback && feedback.hitFeedback) {
      feedback.hitFeedback(source || (amount === 25 ? 'knife' : 'punch'), this.target.object3D.position);
    }


    if (this.hp === 0) {
      this.target.setAttribute('color', '#FFD54F');
      this.label.setAttribute('value', 'Complete!');
      this.resetAt = performance.now() + 1500;
    } else {
      this.target.setAttribute('color', '#FF7043');

      this.label.setAttribute(
        'value',
        'HP ' + this.hp + ' / 100'
      );

      this.flashAt = performance.now() + 160;
    }
  },

  desktopPunch: function () {
    const cutter = this.el.components['plasma-cutter'];
    if (cutter && cutter.active) { cutter.desktopSwing(); return; }
    const now = performance.now();

    if (now < this.nextClick) return;
    this.nextClick = now + 350;

    this.view.object3D.getWorldPosition(this.head);
    this.view.object3D.getWorldQuaternion(this.q);

    this.forward.set(0, 0, -1)
      .applyQuaternion(this.q)
      .normalize();

    this.target.object3D.getWorldPosition(
      this.sphere.center
    );

    this.ray.set(this.head, this.forward);

    const hit = this.ray.intersectSphere(
      this.sphere,
      this.hitPoint
    );

    if (hit && this.head.distanceTo(hit) <= 1.25) {
      this.damage();
    }
  },

  rotatePlayer: function (angle) {
    const climbing = this.el.components['ledge-climb'];
    const grabbed = climbing
      ? climbing.hands.filter(hand => hand.grabbing)
      : [];
    this.rig.object3D.updateWorldMatrix(true, true);
    grabbed.forEach(hand => {
      hand.el.object3D.getWorldPosition(hand.world);
    });

    this.view.object3D.getWorldPosition(this.head);

    this.rig.object3D.rotation.y += angle;
    this.rig.object3D.updateWorldMatrix(true, true);

    this.view.object3D.getWorldPosition(this.after);

    this.rig.object3D.position.x +=
      this.head.x - this.after.x;

    this.rig.object3D.position.z +=
      this.head.z - this.after.z;

    this.rig.object3D.updateWorldMatrix(true, true);
    // Rebase artificial turning, not physical pulling.
    grabbed.forEach(hand => {
      hand.el.object3D.getWorldPosition(this.after);
      hand.anchor.add(this.after.sub(hand.world));
      hand.el.object3D.getWorldPosition(hand.world);
    });
    this.hands.forEach(hand => { hand.ready = false; });
  },

  tick: function (time, delta) {
    if (this.el.components['pause-menu'] && this.el.components['pause-menu'].opened) return;
    if (document.hidden || !delta || delta > 100) {
      this.clearInput();
      return;
    }

    if (this.inVR()) {
      const session = this.el.renderer.xr.getSession();

      if (
        session &&
        session.visibilityState !== 'visible'
      ) {
        this.clearInput();
        return;
      }
    }
    const dt = delta / 1000;
    const now = performance.now();
    const vr = this.inVR();
    this.stepKeyboardLook(dt);

    if (vr) {
      const turn = this.axes.turn;
      const amount = Math.abs(turn);

      if (amount < 0.25) {
        this.snapReady = true;
      }

      if (
        this.mode === 'smooth' &&
        amount > 0.18
      ) {
        const speed = THREE.MathUtils.degToRad(
          this.turnSpeeds[this.turnIndex]
        );

        this.rotatePlayer(
          -Math.sign(turn) *
          (amount - 0.18) / 0.82 *
          speed * dt
        );
      } else if (
        this.mode === 'snap' &&
        amount > 0.65 &&
        this.snapReady
      ) {
        this.rotatePlayer(
          -Math.sign(turn) *
          THREE.MathUtils.degToRad(30)
        );

        this.snapReady = false;
      }
    }


    const climbing = this.el.components['ledge-climb'];
    if (climbing && climbing.step(this)) {
      return;
    }

    const touch = this.el.components['touch-controls'];
    let x = vr ? this.axes.x : (touch && touch.moving ? touch.moveX :
      Number(this.keys.has('KeyD')) - Number(this.keys.has('KeyA')));

    let y = vr ? this.axes.y : (touch && touch.moving ? touch.moveY :
      Number(this.keys.has('KeyS')) - Number(this.keys.has('KeyW')));

    const magnitude = Math.hypot(x, y);
    const deadzone = vr ? 0.18 : 0;

    if (magnitude > deadzone) {
      const scale = Math.min(
        1,
        (magnitude - deadzone) / (1 - deadzone)
      );

      x = x / magnitude * scale;
      y = y / magnitude * scale;
    } else {
      x = 0;
      y = 0;
    }

    const sprintHeld = vr
      ? this.grip
      : this.keys.has('ShiftLeft') || this.keys.has('ShiftRight') || (touch && touch.sprint);

    if (
      this.exhausted &&
      this.stamina >= 30 &&
      !sprintHeld
    ) {
      this.exhausted = false;
    }

    const sprint =
      sprintHeld &&
      Math.hypot(x, y) > 0.35 &&
      this.grounded &&
      !this.exhausted &&
      this.stamina > 0;

    if (sprint) {
      this.stamina = Math.max(
        0,
        this.stamina - 8 * dt
      );

      if (this.stamina === 0) {
        this.exhausted = true;
      }
    } else if (this.grounded && !(this.el.components['plasma-cutter'] &&
        this.el.components['plasma-cutter'].guiding)) {
      this.stamina = Math.min(
        100,
        this.stamina + 25 * dt
      );
    }


    this.view.object3D.getWorldQuaternion(this.q);

    this.forward.set(0, 0, -1)
      .applyQuaternion(this.q);

    this.forward.y = 0;

    if (this.forward.lengthSq() > 0.01) {
      this.forward.normalize();

      this.side.set(
        -this.forward.z,
        0,
        this.forward.x
      );

            const selectedSpeed =
        this.walkSpeeds[this.walkIndex];

      // Remember movement speed while on the ground.
      if (this.grounded) {
        this.takeoffSpeed =
          selectedSpeed * (sprint ? 1.8 : 1);
      }

      // Keep that speed during the jump or fall.
      const movementSpeed = this.grounded
        ? selectedSpeed * (sprint ? 1.8 : 1)
        : (this.takeoffSpeed ?? selectedSpeed);

      const distance = movementSpeed * dt;

      this.rig.object3D.position
        .addScaledVector(
          this.forward,
          -y * distance
        )
        .addScaledVector(
          this.side,
          x * distance
        );
    }

        // Brief ledge-launch impulse.
    // Stick steering continues to work separately.
    if (this.grounded) {
      this.launchTime = 0;
      this.launchVX = 0;
      this.launchVZ = 0;
    } else if ((this.launchTime || 0) > 0) {
      const pushTime = Math.min(dt, this.launchTime);

      this.rig.object3D.position.x +=
        (this.launchVX || 0) * pushTime;

      this.rig.object3D.position.z +=
        (this.launchVZ || 0) * pushTime;

      this.launchTime = Math.max(
        0,
        this.launchTime - pushTime
      );
    }

    // Create three fixed practice platforms once.
    if (!this.practicePlatforms) {
      this.practicePlatforms = [
        {
          x: 0,
          z: -2,
          width: 2,
          depth: 1.2,
          top: 0.35,
          color: '#4DB6AC'
        },
        {
          x: 0,
          z: -3.6,
          width: 2,
          depth: 1.2,
          top: 0.70,
          color: '#42A5F5'
        },
        {
          x: 0,
          z: -5.2,
          width: 2,
          depth: 1.2,
          top: 1.05,
          color: '#AB80E8'
        }
      ];

      this.practicePlatforms.forEach(platform => {
        const box = document.createElement('a-box');

        box.setAttribute('position', {
          x: platform.x,
          y: platform.top / 2,
          z: platform.z
        });

        box.setAttribute('width', platform.width);
        box.setAttribute('height', platform.top);
        box.setAttribute('depth', platform.depth);
        box.setAttribute('color', platform.color);

        this.el.appendChild(box);
      });
    }

    const previousFeetY = this.rig.object3D.position.y;

    // Apply gravity during a jump or fall.
    if (!this.grounded) {
      this.velocityY -= 9.8 * dt;
      this.rig.object3D.position.y += this.velocityY * dt;
    }

    this.rig.object3D.updateWorldMatrix(true, true);
    this.view.object3D.getWorldPosition(this.head);

    const playerRadius = 0.18;

    const playerHeight = THREE.MathUtils.clamp(
      this.head.y - this.rig.object3D.position.y,
      0.8,
      2.2
    );

    let landingHeight = null;

    // Find a platform top crossed while descending.
    if (this.velocityY <= 0) {
      this.practicePlatforms.forEach(platform => {
        const overPlatform =
          Math.abs(this.head.x - platform.x) <
            platform.width / 2 + playerRadius * 0.5 &&
          Math.abs(this.head.z - platform.z) <
            platform.depth / 2 + playerRadius * 0.5;

        const crossedTop =
          previousFeetY >= platform.top - 0.02 &&
          this.rig.object3D.position.y <= platform.top;

        if (overPlatform && crossedTop) {
          if (
            landingHeight === null ||
            platform.top > landingHeight
          ) {
            landingHeight = platform.top;
          }
        }
      });
    }

    if (landingHeight !== null) {
      this.rig.object3D.position.y = landingHeight;
      this.velocityY = 0;
      this.grounded = true;
    } else if (this.rig.object3D.position.y <= 0) {
      this.landReset();
    }

    // Resolve simple collisions against platform sides.
    this.practicePlatforms.forEach(platform => {
      const feetY = this.rig.object3D.position.y;
      const bodyTop = feetY + playerHeight;

      if (
        feetY >= platform.top - 0.01 ||
        bodyTop <= 0
      ) {
        return;
      }

      this.rig.object3D.updateWorldMatrix(true, true);
      this.view.object3D.getWorldPosition(this.head);

      const offsetX = this.head.x - platform.x;
      const offsetZ = this.head.z - platform.z;

      const overlapX =
        platform.width / 2 +
        playerRadius -
        Math.abs(offsetX);

      const overlapZ =
        platform.depth / 2 +
        playerRadius -
        Math.abs(offsetZ);

      if (overlapX > 0 && overlapZ > 0) {
        if (overlapX < overlapZ) {
          this.rig.object3D.position.x +=
            (offsetX >= 0 ? 1 : -1) * overlapX;
        } else {
          this.rig.object3D.position.z +=
            (offsetZ >= 0 ? 1 : -1) * overlapZ;
        }
      }
    });

    // Check whether the player has walked off a platform.
    this.rig.object3D.updateWorldMatrix(true, true);
    this.view.object3D.getWorldPosition(this.head);

    if (
      this.grounded &&
      this.rig.object3D.position.y > 0
    ) {
      const supported = this.practicePlatforms.some(platform => {
        const atTop =
          Math.abs(
            this.rig.object3D.position.y - platform.top
          ) < 0.02;

        const overPlatform =
          Math.abs(this.head.x - platform.x) <
            platform.width / 2 + playerRadius * 0.5 &&
          Math.abs(this.head.z - platform.z) <
            platform.depth / 2 + playerRadius * 0.5;

        return atTop && overPlatform;
      });

      if (!supported) {
        this.grounded = false;
        this.velocityY = 0;
      }
    }

    this.rig.object3D.updateWorldMatrix(true, true);
    this.view.object3D.getWorldPosition(this.head);

    this.rig.object3D.position.x +=
      THREE.MathUtils.clamp(this.head.x, -7, 7) -
      this.head.x;

    this.rig.object3D.position.z +=
      THREE.MathUtils.clamp(this.head.z, -7, 7) -
      this.head.z;

    this.rig.object3D.updateWorldMatrix(true, true);
    this.view.object3D.getWorldPosition(this.head);

    if (this.placeAt && now >= this.placeAt) {
      this.placeAt = 0;
      this.placeTarget();
    }

    this.label.object3D.lookAt(this.head);

    if (this.resetAt && now >= this.resetAt) {
      this.hp = 100;
      this.resetAt = 0;

      this.label.setAttribute(
        'value',
        'HP 100 / 100'
      );

      this.target.setAttribute(
        'color',
        '#26C6DA'
      );
    }

    if (this.flashAt && now >= this.flashAt) {
      this.flashAt = 0;

      if (this.hp > 0) {
        this.target.setAttribute(
          'color',
          '#26C6DA'
        );
      }
    }

    this.target.object3D.getWorldPosition(
      this.center
    );

    this.hands.forEach(hand => {
      const cutter = this.el.components['plasma-cutter'];
      const climbingHand = climbing && climbing.hands.find(candidate => candidate.el === hand.el);
      if (!vr || !hand.connected || (climbingHand && climbingHand.grabbing) ||
          (cutter && cutter.blocksFist(hand.el))) {
        hand.ready = false;
        return;
      }

      const local = hand.el.object3D.position;

      hand.el.object3D.getWorldPosition(
        hand.world
      );

      if (!hand.ready) {
        hand.previous.copy(local);
        hand.ready = true;
        return;
      }

      const speed =
        local.distanceTo(hand.previous) / dt;

      const distance =
        hand.world.distanceTo(this.center);

      if (distance > 0.29) {
        hand.inside = false;
      }

      if (
        distance < 0.23 &&
        !hand.inside
      ) {
        hand.inside = true;

        if (
          speed >= 0.45 &&
          now >= hand.nextHit &&
          !this.resetAt
        ) {
          hand.nextHit = now + 350;
          this.damage();
        }
      }

      hand.previous.copy(local);
    });

    const state = !this.grounded
      ? 'AIR'
      : sprint
        ? 'SPRINT'
        : this.exhausted
          ? 'RECOVER: release sprint'
          : 'READY';

    const status =
      'WRIST LAB v6.2.10 | ' +
      (vr ? 'VR' : 'DESKTOP') + '\n' +
      'Stamina ' +
      Math.ceil(this.stamina) +
      '/100 | ' + state;

    if (status !== this.lastHUD) {
      this.lastHUD = status;

      this.vrhud.setAttribute(
        'value',
        status
      );

      this.hud.textContent = status;
    }
  }
});
</script>
  <script>
AFRAME.registerComponent('ledge-climb', {
  init: function () {
    this.rig = document.querySelector('#rig');
    this.view = document.querySelector('#view');

    this.head = new THREE.Vector3();
    this.correction = new THREE.Vector3();
    this.nearest = new THREE.Vector3();

    this.ledge = {
      x: 3,
      z: -3,
      width: 2,
      depth: 1.5,
      top: 1.45,
      color: '#FFAA55'
    };

    this.ledges = [
      this.ledge,
      {x: 3, z: -0.6, width: 2, depth: 1.3, top: 0.8, color: '#51BBA8'},
      {x: 5, z: -2.8, width: 1.8, depth: 1.8, top: 2.05, color: '#538FE8'},
      {x: 5, z: -5.2, width: 2, depth: 1.8, top: 2.65, color: '#AB80E8'}
    ];

    this.hands = ['#left', '#right'].map(selector => ({
      el: document.querySelector(selector),
      held: false,
      grabbing: false,
      anchor: new THREE.Vector3(),
      world: new THREE.Vector3()
    }));

    this.hands.forEach(hand => {
      hand.el.addEventListener('gripdown', () => {
        if (this.el.is('vr-mode')) {
          hand.held = true;
        }
      });

      hand.el.addEventListener('gripup', () => {
        hand.held = false;
      });

      hand.el.addEventListener('controllerdisconnected', () => {
        this.releaseAll();
      });
    });

    this.el.addEventListener('exit-vr', () => {
      this.releaseAll();
    });

    this.el.addEventListener('enter-vr', () => {
      this.releaseAll();
    });

    window.addEventListener('blur', () => {
      this.releaseAll();
    });

    document.addEventListener('visibilitychange', () => {
      this.releaseAll();
    });

    this.wasClimbing = false;
    this.cooldownUntil = 0;

    // Scene-space proxy grips stay on the structure, not the rotating rig.
    this.hands.forEach((hand, index) => {
      hand.contact = new THREE.Vector3();
      hand.proxy = new THREE.Group();
      const material = new THREE.MeshStandardMaterial({
        color: index === 0 ? 0x55ddff : 0xffd166,
        roughness: 0.8
      });
      const palm = new THREE.Mesh(
        new THREE.BoxGeometry(0.085, 0.035, 0.10), material
      );
      palm.position.set(0, 0.025, 0.018);
      hand.proxy.add(palm);
      for (let finger = 0; finger < 4; finger++) {
        const tip = new THREE.Mesh(
          new THREE.BoxGeometry(0.016, 0.045, 0.028), material
        );
        tip.position.set((finger - 1.5) * 0.021, -0.004, -0.036);
        hand.proxy.add(tip);
      }
      hand.proxy.visible = false;
      this.el.object3D.add(hand.proxy);
    });
    this.launchArrow = new THREE.ArrowHelper(
      new THREE.Vector3(0, 0, 1), new THREE.Vector3(),
      0.85, 0xffd166, 0.18, 0.10
    );
    this.launchArrow.visible = false;
    this.el.object3D.add(this.launchArrow);
    this.previewHead = new THREE.Vector3();
    this.previewDirection = new THREE.Vector3();
  },

  launchDirection: function (out) {
    this.rig.object3D.updateWorldMatrix(true, true);
    this.view.object3D.getWorldPosition(this.head);
    out.set(this.head.x - this.ledge.x, 0,
      this.head.z - this.ledge.z);
    if (out.lengthSq() < 0.01) {
      const rotation = new THREE.Quaternion();
      this.view.object3D.getWorldQuaternion(rotation);
      out.set(0, 0, 1).applyQuaternion(rotation);
      out.y = 0;
    }
    if (out.lengthSq() < 0.01) out.set(0, 0, 1);
    return out.normalize();
  },

  showGrip: function (hand, visible) {
    hand.proxy.visible = visible;
    const model = hand.el.getObject3D('mesh');
    if (visible) {
      if (model && hand.hiddenModel !== model) {
        hand.hiddenModel = model;
        hand.modelWasVisible = model.visible;
      }
      if (model) model.visible = false;
    } else if (hand.hiddenModel) {
      hand.hiddenModel.visible = hand.modelWasVisible;
      hand.hiddenModel = null;
    }
  },

  updateGripVisuals: function () {
    let holding = false;
    this.hands.forEach(hand => {
      this.showGrip(hand, hand.grabbing);
      holding = holding || hand.grabbing;
    });
    const pack = this.el.components['ability-test'];
    this.launchArrow.visible = holding && (!pack || pack.hints);
    if (holding) {
      this.launchDirection(this.previewDirection);
      // Show the initial upward-and-outward impulse, not a landing prediction.
      this.previewDirection.multiplyScalar(3);
      this.previewDirection.y = 4.2;
      this.previewDirection.normalize();
      this.view.object3D.getWorldPosition(this.previewHead);
      this.previewHead.y -= 0.35;
      this.launchArrow.position.copy(this.previewHead);
      this.launchArrow.setDirection(this.previewDirection);
    }
  },
  
  launch: function (training) {
    if (!this.hands.some(hand => hand.grabbing)) {
      return;
    }

    this.rig.object3D.updateWorldMatrix(true, true);
    this.view.object3D.getWorldPosition(this.head);

    const direction = this.launchDirection(new THREE.Vector3());

    this.releaseAll();
    this.cooldownUntil = performance.now() + 450;

    training.grounded = false;
    training.velocityY = 4.2;

    // A brief horizontal push, separate from stick steering.
    training.launchVX = direction.x * 3;
    training.launchVZ = direction.z * 3;
    training.launchTime = 0.30;

    // Do not inherit an old sprint speed from before climbing.
    training.takeoffSpeed =
      training.walkSpeeds[training.walkIndex];

    training.hands.forEach(hand => {
      hand.ready = false;
    });
  },

  releaseAll: function () {
    this.hands.forEach(hand => {
      hand.held = false;
      hand.grabbing = false;
      this.showGrip(hand, false);
    });
    if (this.launchArrow) this.launchArrow.visible = false;

    this.wasClimbing = false;

    if (this.mesh) {
      this.mesh.setAttribute('color', this.ledge.color);
    }
  },

  step: function (training) {
    if (!training.practicePlatforms) return false;

    // Register all route ledges with the existing landing/side collision system.
    if (!this.routeBuilt) {
      this.routeBuilt = true;
      this.ledges.forEach((ledge, index) => {
        training.practicePlatforms.push(ledge);
        const mesh = document.createElement('a-box');
        mesh.setAttribute('position', {x: ledge.x, y: ledge.top / 2, z: ledge.z});
        mesh.setAttribute('width', ledge.width);
        mesh.setAttribute('height', ledge.top);
        mesh.setAttribute('depth', ledge.depth);
        mesh.setAttribute('color', ledge.color);
        this.el.appendChild(mesh);
        ledge.mesh = mesh;
        const sign = document.createElement('a-text');
        sign.classList.add('tutorial-hint');
        sign.setAttribute('position', {x: ledge.x, y: ledge.top + 0.45, z: ledge.z + ledge.depth / 2 + 0.02});
        sign.setAttribute('value', index === 0 ? 'ORIGINAL LEDGE' :
          index === 3 ? 'SUMMIT TARGET' : 'CLIMB ROUTE ' + index);
        sign.setAttribute('align', 'center');
        sign.setAttribute('width', 1.7);
        const pack = this.el.components['ability-test'];
        sign.object3D.visible = !pack || pack.hints;
        this.el.appendChild(sign);
      });
      this.mesh = this.ledge.mesh;
    }

    if (!this.el.is('vr-mode')) {
      this.releaseAll();
      return false;
    }

    const now = performance.now();
    let ledge = this.ledge;

    this.rig.object3D.updateWorldMatrix(true, true);

    this.hands.forEach(hand => {
      hand.el.object3D.getWorldPosition(hand.world);

      if (!hand.held) {
        hand.grabbing = false;
        return;
      }

      if (hand.grabbing || now < this.cooldownUntil) {
        return;
      }

      let ledge = null;
      let bestDistance = 0.22;
      const already = this.hands.find(other => other.grabbing);
      const candidates = already ? [already.ledge] : this.ledges;
      candidates.forEach(candidate => {
        const point = new THREE.Vector3(
          THREE.MathUtils.clamp(hand.world.x, candidate.x - candidate.width / 2,
            candidate.x + candidate.width / 2), candidate.top,
          THREE.MathUtils.clamp(hand.world.z, candidate.z - candidate.depth / 2,
            candidate.z + candidate.depth / 2));
        const distance = hand.world.distanceTo(point);
        if (distance < bestDistance) {
          bestDistance = distance;
          ledge = candidate;
        }
      });
      if (!ledge) return;

      // Find the closest point on this ledge's top.
      this.nearest.set(
        THREE.MathUtils.clamp(
          hand.world.x,
          ledge.x - ledge.width / 2,
          ledge.x + ledge.width / 2
        ),
        ledge.top,
        THREE.MathUtils.clamp(
          hand.world.z,
          ledge.z - ledge.depth / 2,
          ledge.z + ledge.depth / 2
        )
      );

      if (hand.world.distanceTo(this.nearest) < 0.22) {
        hand.grabbing = true;
        hand.ledge = ledge;

        // Anchor at the hand's current position to avoid a snap.
        hand.anchor.copy(hand.world);
        // Visual contact is separate from the rebased movement anchor.
        hand.contact.copy(this.nearest);
        hand.proxy.position.copy(hand.contact);
        const dx = (hand.world.x - ledge.x) / (ledge.width / 2);
        const dz = (hand.world.z - ledge.z) / (ledge.depth / 2);
        const outside = new THREE.Vector3();
        if (Math.abs(dx) > Math.abs(dz)) {
          outside.set(dx >= 0 ? 1 : -1, 0, 0);
        } else {
          outside.set(0, 0, dz >= 0 ? 1 : -1);
        }
        hand.proxy.rotation.y = Math.atan2(outside.x, outside.z);
      }
    });

    this.updateGripVisuals();

    const activeHands = this.hands.filter(hand => hand.grabbing);

    if (activeHands.length > 0) {
      this.ledge = activeHands[0].ledge;
      ledge = this.ledge;
      this.mesh = ledge.mesh;
      this.ledges.forEach(item => item.mesh.setAttribute('color', item.color));
      training.launchTime = 0;
      this.correction.set(0, 0, 0);

      activeHands.forEach(hand => {
        this.correction.x += hand.anchor.x - hand.world.x;
        this.correction.y += hand.anchor.y - hand.world.y;
        this.correction.z += hand.anchor.z - hand.world.z;
      });

      this.correction.divideScalar(activeHands.length);

      // Limit correction from a single tracking update.
      this.correction.clampLength(0, 0.12);

      this.rig.object3D.position.add(this.correction);

      training.velocityY = 0;
      training.grounded = false;

      training.hands.forEach(hand => {
        hand.ready = false;
      });

      this.wasClimbing = true;
      this.mesh.setAttribute('color', '#FFD54F');

      this.updateGripVisuals();

      // No stamina drain while holding. Pause locomotion and gravity.
      return true;
    }

    if (this.wasClimbing) {
      this.wasClimbing = false;
      this.cooldownUntil = now + 400;

      this.rig.object3D.updateWorldMatrix(true, true);
      this.view.object3D.getWorldPosition(this.head);

      const highEnough = this.head.y > ledge.top + 0.65;

      const nearLedge =
        Math.abs(this.head.x - ledge.x) <
          ledge.width / 2 + 0.65 &&
        Math.abs(this.head.z - ledge.z) <
          ledge.depth / 2 + 0.65;

      if (highEnough && nearLedge && !ledge.noMantle) {
        const finishX = THREE.MathUtils.clamp(
          this.head.x,
          ledge.x - ledge.width / 2 + 0.3,
          ledge.x + ledge.width / 2 - 0.3
        );

        const finishZ = THREE.MathUtils.clamp(
          this.head.z,
          ledge.z - ledge.depth / 2 + 0.3,
          ledge.z + ledge.depth / 2 - 0.3
        );

        this.rig.object3D.position.x += finishX - this.head.x;
        this.rig.object3D.position.z += finishZ - this.head.z;
        this.rig.object3D.position.y = ledge.top;

        training.velocityY = 0;
        training.grounded = true;
      } else {
        training.velocityY = 0;
        training.grounded = false;
      }

      this.mesh.setAttribute('color', ledge.color);
    }

    return false;
  }
});

    document.addEventListener('visibilitychange', () => {
      if (document.hidden) this.cancelKnife();
    });
  },

  requestPrimary: function () {
    this.throwRequested = true;
    const cutter = this.el.components['plasma-cutter'];
    if (cutter && cutter.active) cutter.beginPress();
  },

  initFeedback: function () {
    this.soundVolume = 0.30;
    this.muted = false;
    try {
      const saved = JSON.parse(localStorage.getItem('descent-audio-v1') || 'null');
      if (saved) {
        if (typeof saved.volume === 'number' && Number.isFinite(saved.volume))
          this.soundVolume = THREE.MathUtils.clamp(saved.volume, 0, 1);
        this.muted = saved.muted === true;
      }
    } catch (error) {}
    this.audioContext = null;
    this.masterGain = null;
    this.effectCursor = 0;
    this.effects = [];
    for (let index = 0; index < 8; index++) {
      const vertices = [];
      for (let ray = 0; ray < 8; ray++) {
        const angle = ray * Math.PI / 4;
        const height = ray % 2 ? 0.5 : -0.5;
        vertices.push(Math.cos(angle) * 0.025, height * 0.025, Math.sin(angle) * 0.025,
          Math.cos(angle) * 0.11, height * 0.11, Math.sin(angle) * 0.11);
      }
      const geometry = new THREE.BufferGeometry();
      geometry.setAttribute('position', new THREE.Float32BufferAttribute(vertices, 3));
      const mesh = new THREE.LineSegments(geometry,
        new THREE.LineBasicMaterial({color: 0xffd166, transparent: true, opacity: 1}));
      mesh.visible = false;
      this.el.object3D.add(mesh);
      this.effects.push({mesh: mesh, life: 0, duration: 0.22});
    }
    // Static scenery blocks projectiles only. Player collisions remain unchanged.
    this.decorativeSolids = [
      {x: -2, z: -5, width: 0.6, depth: 0.6, bottom: 0, top: 3},
      {x: 2, z: -5, width: 0.6, depth: 0.6, bottom: 0, top: 3},
      {x: 0, z: -5, width: 4.6, depth: 0.6, bottom: 3, top: 3.4},
      {x: 4, z: 0, width: 1, depth: 1, bottom: 0, top: 1},
      {x: -4, z: 0, width: 1, depth: 1, bottom: 0, top: 1}
    ];
    this.soundButtons = [];
    this.soundPanel = document.createElement('a-entity');
    const backing = document.createElement('a-plane');
    backing.setAttribute('position', '-3 1.32 -1.66');
    backing.setAttribute('width', 2.05);
    backing.setAttribute('height', 0.7);
    backing.setAttribute('color', '#142232');
    this.soundPanel.appendChild(backing);
    this.soundLabel = document.createElement('a-text');
    this.soundLabel.setAttribute('position', '-3 1.51 -1.62');
    this.soundLabel.setAttribute('align', 'center');
    this.soundLabel.setAttribute('width', 1.8);
    this.soundPanel.appendChild(this.soundLabel);
    ['mute', 'down', 'up', 'test'].forEach((action, index) => {
      const x = -3.69 + index * 0.46;
      const button = document.createElement('a-box');
      button.setAttribute('position', {x: x, y: 1.20, z: -1.60});
      button.setAttribute('width', 0.42);
      button.setAttribute('height', 0.22);
      button.setAttribute('depth', 0.05);
      button.setAttribute('color', '#35516B');
      this.soundPanel.appendChild(button);
      const label = document.createElement('a-text');
      label.setAttribute('position', {x: x, y: 1.20, z: -1.568});
      label.setAttribute('align', 'center');
      label.setAttribute('width', 0.7);
      label.setAttribute('value', ['MUTE', 'VOL -', 'VOL +', 'TEST'][index]);
      this.soundPanel.appendChild(label);
      this.soundButtons.push({action: action,
        box: new THREE.Box3(new THREE.Vector3(x - 0.21, 1.09, -1.635),
          new THREE.Vector3(x + 0.21, 1.31, -1.565))});
    });
    this.el.appendChild(this.soundPanel);
    this.soundPanel.object3D.visible = false;
    const panel = document.createElement('div');
    panel.id = 'audio-panel';
    panel.innerHTML = '<span id="audio-label"></span> <button type="button" data-audio="mute">Mute</button> <button type="button" data-audio="down">Vol -</button> <button type="button" data-audio="up">Vol +</button> <button type="button" data-audio="test">Test sound</button>';
    document.body.appendChild(panel);
    panel.querySelectorAll('button').forEach(button => {
      button.addEventListener('click', event => {
        event.stopPropagation();
        this.soundAction(button.dataset.audio);
      });
    });
    panel.addEventListener('keydown', event => event.stopPropagation());
    window.addEventListener('pointerdown', () => this.unlockAudio(), {capture: true});
    window.addEventListener('keydown', event => {
      if (event.target.closest && event.target.closest('input,textarea,[contenteditable],button')) return;
      this.unlockAudio();
      if (event.repeat || this.el.is('vr-mode')) return;
      if (event.code === 'KeyM') this.soundAction('mute');
      if (event.code === 'BracketLeft') this.soundAction('down');
      if (event.code === 'BracketRight') this.soundAction('up');
    });
    this.el.addEventListener('enter-vr', () => this.unlockAudio());
    this.updateAudioSettings();
  },

  unlockAudio: function () {
    try {
      if (!this.audioContext || this.audioContext.state === 'closed') {
        const Context = window.AudioContext || window.webkitAudioContext;
        if (!Context) return Promise.resolve(false);
        this.audioContext = new Context();
        this.masterGain = this.audioContext.createGain();
        const limiter = this.audioContext.createDynamicsCompressor();
        limiter.threshold.value = -12;
        limiter.knee.value = 16;
        limiter.ratio.value = 6;
        limiter.attack.value = 0.003;
        limiter.release.value = 0.10;
        this.masterGain.connect(limiter);
        limiter.connect(this.audioContext.destination);
        this.updateAudioSettings();
      }
      if (this.audioContext.state === 'suspended') {
        return this.audioContext.resume().then(() => this.audioContext.state === 'running').catch(() => false);
      }
      return Promise.resolve(this.audioContext.state === 'running');
    } catch (error) { return Promise.resolve(false); }
  },

  updateAudioSettings: function () {
    if (this.masterGain && this.audioContext) {
      this.masterGain.gain.setTargetAtTime(this.muted ? 0 : this.soundVolume,
        this.audioContext.currentTime, 0.015);
    }
    const text = this.muted ? 'SFX MUTED' : 'SFX ' + Math.round(this.soundVolume * 100) + '%';
    if (this.soundLabel) this.soundLabel.setAttribute('value', 'SOUND CONTROLS | ' + text + '\nAim at button + right trigger (within 3m)');
    const label = document.querySelector('#audio-label');
    if (label) label.textContent = text;
    try { localStorage.setItem('descent-audio-v1', JSON.stringify({volume: this.soundVolume, muted: this.muted})); }
    catch (error) {}
  },

  soundAction: function (action) {
    const ready = this.unlockAudio();
    if (action === 'mute') this.muted = !this.muted;
    if (action === 'down') this.soundVolume = Math.max(0, Math.round((this.soundVolume - 0.1) * 10) / 10);
    if (action === 'up') this.soundVolume = Math.min(1, Math.round((this.soundVolume + 0.1) * 10) / 10);
    this.updateAudioSettings();
    this.lastHit = this.muted ? 'SFX MUTED' : 'SFX ' + Math.round(this.soundVolume * 100) + '%';
    this.feedbackUntil = this.clock + 1.5;
    if (action === 'test') ready.then(ok => {
      if (ok) this.playEffect('wall');
      else {
        this.lastHit = 'Audio not unlocked - click Test sound in browser';
        this.feedbackUntil = this.clock + 3;
      }
    });
  },

  playEffect: function (kind) {
    const ctx = this.audioContext;
    if (!ctx || ctx.state !== 'running' || this.muted || this.soundVolume <= 0) return;
    const t = ctx.currentTime;
    const tone = (frequency, endFrequency, duration, volume, type) => {
      const oscillator = ctx.createOscillator();
      const envelope = ctx.createGain();
      oscillator.type = type || 'sine';
      oscillator.frequency.setValueAtTime(frequency, t);
      oscillator.frequency.exponentialRampToValueAtTime(endFrequency, t + duration);
      envelope.gain.setValueAtTime(0.0001, t);
      envelope.gain.exponentialRampToValueAtTime(volume, t + 0.005);
      envelope.gain.exponentialRampToValueAtTime(0.0001, t + duration);
      oscillator.connect(envelope);
      envelope.connect(this.masterGain);
      oscillator.onended = () => { oscillator.disconnect(); envelope.disconnect(); };
      oscillator.start(t);
      oscillator.stop(t + duration + 0.02);
    };
    try {
      if (kind === 'wall') {
        tone(920, 750, 0.21, 0.14, 'sine');
        tone(1531, 1300, 0.15, 0.07, 'sine');
        tone(2377, 1900, 0.09, 0.035, 'triangle');
      } else if (kind === 'punch') {
        tone(150, 55, 0.12, 0.22, 'triangle');
        tone(80, 45, 0.09, 0.10, 'sine');
      } else if (kind === 'knife') {
        tone(640, 1040, 0.085, 0.14, 'triangle');
        tone(1280, 820, 0.12, 0.055, 'sine');
      } else if (kind === 'launch') {
        tone(240, 1050, 0.20, 0.19, 'triangle');
        tone(110, 360, 0.17, 0.12, 'sine');
      } else if (kind === 'retrieve') {
        tone(950, 270, 0.22, 0.16, 'triangle');
        tone(300, 150, 0.18, 0.09, 'sine');
      } else if (kind === 'hover') {
        tone(620, 440, 0.08, 0.075, 'sine');
      } else if (kind === 'ignite') {
        tone(120, 850, 0.22, 0.12, 'triangle');
        tone(60, 220, 0.18, 0.08, 'sine');
      } else if (kind === 'extinguish') {
        tone(650, 85, 0.18, 0.09, 'triangle');
      } else if (kind === 'plasma') {
        tone(180, 70, 0.12, 0.16, 'triangle');
        tone(1700, 540, 0.13, 0.065, 'sine');
      } else if (kind === 'catch') {
        tone(440, 660, 0.075, 0.085, 'sine');
      }
    } catch (error) {}
  },

  hitFeedback: function (kind, position) {
    this.playEffect(kind);
    if (!this.effects || !this.effects.length || !position) return;
    const effect = this.effects[this.effectCursor++ % this.effects.length];
    effect.duration = kind === 'catch' ? 0.13 : 0.22;
    effect.life = effect.duration;
    effect.mesh.position.copy(position);
    effect.mesh.scale.setScalar(kind === 'catch' ? 0.6 : 1);
    effect.mesh.material.color.setHex(kind === 'wall' ? 0xffc04d : kind === 'catch' ? 0x88ffd0 : 0x55ddff);
    effect.mesh.material.opacity = 1;
    effect.mesh.visible = true;
  },

  updateFeedback: function (dt) {
    this.effects.forEach(effect => {
      if (effect.life <= 0) return;
      effect.life = Math.max(0, effect.life - dt);
      const progress = 1 - effect.life / effect.duration;
      effect.mesh.visible = effect.life > 0;
      effect.mesh.material.opacity = 1 - progress;
      effect.mesh.scale.setScalar((effect.duration < 0.2 ? 0.6 : 1) + progress * 1.7);
    });
  },

  blockingDistance: function (start, direction, length, training) {
    let nearest = Infinity;
    const check = solid => {
      this.box.min.set(solid.x - solid.width / 2, solid.bottom || 0, solid.z - solid.depth / 2);
      this.box.max.set(solid.x + solid.width / 2, solid.top, solid.z + solid.depth / 2);
      const distance = this.box.containsPoint(start) ? 0 : this.segmentDistance(start, direction, length, this.box);
      nearest = Math.min(nearest, distance);
    };
    (training.practicePlatforms || []).forEach(check);
    this.decorativeSolids.forEach(check);
    if (direction.y < -0.00001) {
      const floor = (0.01 - start.y) / direction.y;
      if (floor >= 0 && floor <= length) nearest = Math.min(nearest, floor);
    }
    return nearest;
  },

  findSoundButton: function () { return null; },

  readAim: function (origin, direction, handedness) {
    if (!this.el.is('vr-mode')) {
      this.rig.object3D.updateWorldMatrix(true, true);
      this.view.object3D.getWorldPosition(origin);
      this.view.object3D.getWorldQuaternion(this.quaternion);
      direction.set(0, 0, -1).applyQuaternion(this.quaternion).normalize();
      return true;
    }
    const xr = this.el.renderer.xr;
    const session = xr.getSession();
    const frame = xr.getFrame ? xr.getFrame() : this.el.frame;
    const tracked = this.el.systems['tracked-controls'];
    const referenceSpace = tracked && tracked.referenceSpace ?
      tracked.referenceSpace : xr.getReferenceSpace();
    if (!session || session.visibilityState !== 'visible' || !frame || !referenceSpace) return false;
    const source = Array.from(session.inputSources).find(input =>
      input.handedness === (handedness || 'right') && input.targetRayMode === 'tracked-pointer' && !input.hand);
    if (!source || !source.targetRaySpace) return false;
    let pose;
    try { pose = frame.getPose(source.targetRaySpace, referenceSpace); }
    catch (error) { return false; }
    if (!pose) return false;
    // XR poses are relative to the tracking origin; apply the locomotion parent once.
    const controller = handedness === 'left' ? this.left : this.right;
    const parent = controller && controller.object3D.parent;
    if (!parent) return false;
    parent.updateWorldMatrix(true, false);
    this.aimMatrix.fromArray(pose.transform.matrix);
    this.aimMatrix.premultiply(parent.matrixWorld);
    origin.setFromMatrixPosition(this.aimMatrix);
    direction.set(0, 0, -1).transformDirection(this.aimMatrix);
    return true;
  },

  segmentSphereDistance: function (start, direction, length, sphere) {
    if (sphere.containsPoint(start)) return 0;
    this.ray.set(start, direction);
    const hit = this.ray.intersectSphere(sphere, this.point);
    if (!hit) return Infinity;
    const distance = start.distanceTo(hit);
    return distance <= length + 0.0001 ? distance : Infinity;
  },

  updateAimGuide: function (training, valid) {
    const visible = valid && this.hints;
    this.aimLine.visible = visible;
    this.aimDot.visible = visible;
    if (!visible) return;
    const cutter = this.el.components['plasma-cutter'];
    const range = cutter && cutter.active ? 12 : 9;
    let distance = range;
    if (this.hp > 0) distance = Math.min(distance,
      this.segmentDistance(this.aimOrigin, this.aimDirection, range, this.targetBox));
    if (training.hp > 0 && !training.resetAt) {
      training.target.object3D.getWorldPosition(this.orbSphere.center);
      distance = Math.min(distance,
        this.segmentSphereDistance(this.aimOrigin, this.aimDirection, range, this.orbSphere));
    }
    distance = Math.min(distance, this.blockingDistance(this.aimOrigin, this.aimDirection, range, training));
    const menu = this.findSoundButton(this.aimOrigin, this.aimDirection, training);
    if (menu) distance = Math.min(distance, menu.distance);
    const guideColor = menu ? 0xffd166 : 0x55ddff;
    this.aimLine.material.color.setHex(guideColor);
    this.aimDot.material.color.setHex(guideColor);
    this.aimEnd.copy(this.aimOrigin).addScaledVector(this.aimDirection, distance);
    const attribute = this.aimLine.geometry.attributes.position;
    attribute.setXYZ(0, this.aimOrigin.x, this.aimOrigin.y, this.aimOrigin.z);
    attribute.setXYZ(1, this.aimEnd.x, this.aimEnd.y, this.aimEnd.z);
    attribute.needsUpdate = true;
    this.aimDot.position.copy(this.aimEnd);
  },

  toggleHints: function () {
    this.hints = !this.hints;
    const training = this.el.components['training-v4'];
    if (training) training.lastHUD = '';
    this.el.querySelectorAll('.tutorial-hint').forEach(el => {
      el.object3D.visible = this.hints;
    });
    const climbing = this.el.components['ledge-climb'];
    if (climbing) climbing.updateGripVisuals();
    this.lastHit = 'Hints ' + (this.hints ? 'ON' : 'OFF');
    this.feedbackUntil = this.clock + 1.5;
    if (!this.hints) { this.aimLine.visible = false; this.aimDot.visible = false; }
  },

  cancelKnife: function () {
    this.throwRequested = false;
    if (this.aimLine) this.aimLine.visible = false;
    if (this.aimDot) this.aimDot.visible = false;
    this.state = 'READY';
    this.cooldown = 0;
    this.flightAge = 0;
    this.knifeRoot.visible = false;
    this.handSamples.forEach(hand => { hand.ready = false; });
  },

  throwKnife: function () {
    if (document.hidden) return;
    const vr = this.el.is('vr-mode');
    if (vr) {
      const session = this.el.renderer.xr.getSession();
      if (session && session.visibilityState !== 'visible') return;
      const training = this.el.components['training-v4'];
      if (!training || !training.hands.some(hand => hand.el === this.right && hand.connected)) return;
    }
    if (!this.readAim(this.origin, this.direction)) {
      this.lastHit = 'XR AIM UNAVAILABLE - try again when tracking returns';
      this.feedbackUntil = this.clock + 1.5;
      return;
    }
    const training = this.el.components['training-v4'];
    const menu = this.findSoundButton(this.origin, this.direction, training);
    if (menu) {
      this.soundAction(menu.action);
      const cutter = this.el.components['plasma-cutter'];
      if (cutter) cutter.clearTrigger();
      return;
    }
    const cutter = this.el.components['plasma-cutter'];
    if (cutter && cutter.active) { cutter.primaryAction(this.origin, this.direction); return; }
    if (this.state !== 'READY' || this.cooldown > 0) return;
    this.knifeRoot.position.copy(this.origin);
    this.velocity.copy(this.direction).multiplyScalar(10);
    this.knifeRoot.quaternion.setFromUnitVectors(this.bladeForward, this.direction);
    this.knifeVisual.rotation.set(0, 0, 0);
    this.distanceTravelled = 0;
    this.flightAge = 0;
    this.hitThisThrow = false;
    this.state = 'OUTBOUND';
    this.knifeRoot.visible = true;
  },

  damageDummy: function (amount, source, contact) {
    if (this.hp <= 0) return;
    this.hp = Math.max(0, this.hp - amount);
    this.hitFeedback(source === 'PLASMA' ? 'plasma' : source === 'KNIFE' ? 'knife' : 'punch',
      contact || (source === 'KNIFE' ? this.knifeRoot.position : this.next));
    this.lastHit = source + ' HIT -' + amount;
    this.feedbackUntil = this.clock + 1.5;
    this.flashUntil = this.clock + 0.18;
    if (this.hp === 0) {
      this.lastHit = 'DUMMY COMPLETE! Resetting on summit';
      this.resetAt = this.clock + 2;
      this.feedbackUntil = this.clock + 2;
    }
    this.health.setAttribute('value', this.hp > 0 ?
      'SUMMIT DUMMY\nHP ' + this.hp + ' / 100' : 'COMPLETE!\nReset in 2 seconds');
  },

  segmentDistance: function (start, direction, length, box) {
    this.ray.set(start, direction);
    const hit = this.ray.intersectBox(box, this.point);
    if (!hit) return Infinity;
    const distance = start.distanceTo(hit);
    return distance <= length + 0.0001 ? distance : Infinity;
  },

  sampleKnifeTargets: function (position, direction, length, training, dt) {
    const result = {dummy: Infinity, orb: Infinity};
    const cutter = this.el.components['plasma-cutter'];
    if (!cutter) return result;
    const startQ = this.knifeRoot.quaternion;
    this.knifeSweepEndQ.copy(startQ);
    if (this.state === 'RETURNING' && length > 0.000001) {
      this.knifeSweepEndQ.setFromUnitVectors(this.bladeForward, direction);
    }
    const spin = (dt || 0) * 18;
    const startAngle = this.knifeVisual.rotation.x - spin;
    const travel = length + Math.abs(spin) * 0.34 + startQ.angleTo(this.knifeSweepEndQ) * 0.34;
    const steps = Math.min(48, Math.max(1, Math.ceil(travel / 0.025)));
    const hits = {dummy: false, orb: false};
    for (let index = 0; index <= steps; index++) {
      const t = index / steps, angle = startAngle + spin * t;
      this.knifeSweepQ.slerpQuaternions(startQ, this.knifeSweepEndQ, t);
      // Actual blade, from its shoulder to its tip; excludes the rear handle.
      this.knifeSweepBase.set(0, -Math.sin(angle) * 0.015, Math.cos(angle) * 0.015)
        .applyQuaternion(this.knifeSweepQ).add(position).addScaledVector(direction, length * t);
      this.knifeSweepTip.set(0, Math.sin(angle) * 0.34, -Math.cos(angle) * 0.34)
        .applyQuaternion(this.knifeSweepQ).add(position).addScaledVector(direction, length * t);
      hits.dummy = hits.orb = false;
      // Shared target/wall test keeps knife and cutter contact coverage consistent.
      cutter.testBladeSegment(this.knifeSweepBase, this.knifeSweepTip, training, hits);
      if (hits.dummy && !Number.isFinite(result.dummy)) result.dummy = length * t;
      if (hits.orb && !Number.isFinite(result.orb)) result.orb = length * t;
    }
    return result;
  },

  beginKnifeReturn: function (training) {
    if (this.state === 'RETURNING') return;
    this.state = 'RETURNING';
    this.knifeReturnHits = {dummy: false, orb: false};
    this.knifeReturnBlocked = false;
    const position = this.knifeRoot.position;
    const touching = this.sampleKnifeTargets(position, this.direction, 0, training, 0);
    this.knifeReturnArmed = {
      dummy: !Number.isFinite(touching.dummy), orb: !Number.isFinite(touching.orb)
    };
  },

  stepKnifeReturnDamage: function (position, direction, length, training, dt) {
    if (this.knifeReturnBlocked || length < 0.000001) return;
    if (Number.isFinite(this.blockingDistance(position, direction, length, training))) {
      this.knifeReturnBlocked = true;
      return;
    }
    const swept = this.sampleKnifeTargets(position, direction, length, training, dt);
    const dummy = swept.dummy, orb = swept.orb;
    for (const kind of ['dummy', 'orb']) {
      const distance = kind === 'dummy' ? dummy : orb;
      if (!Number.isFinite(distance)) { this.knifeReturnArmed[kind] = true; continue; }
      if (!this.knifeReturnArmed[kind] || this.knifeReturnHits[kind]) continue;
      this.knifeReturnHits[kind] = true;
      this.knifeReturnArmed[kind] = false;
      if (kind === 'dummy') {
        this.next.copy(position).addScaledVector(direction, distance);
        this.damageDummy(12, 'KNIFE', this.next);
        this.lastHit += ' | RETURN';
      } else {
        training.damage(12, 'knife');
        this.lastHit = 'ORB KNIFE RETURN HIT -12';
      }
      this.feedbackUntil = this.clock + 1.5;
    }
  },

  stepKnife: function (dt, training) {
    if (this.state === 'READY') return;
    this.flightAge += dt;
    if (this.flightAge > 6) { this.cancelKnife(); return; }
    this.knifeVisual.rotation.x += dt * 18;
    if (this.state === 'OUTBOUND') {
      const length = Math.min(10 * dt, 9 - this.distanceTravelled);
      this.direction.copy(this.velocity).normalize();
      const position = this.knifeRoot.position;
      const swept = this.sampleKnifeTargets(position, this.direction, length, training, dt);
      let targetDistance = this.hitThisThrow ? Infinity : Math.min(swept.dummy, swept.orb);
      const hitKind = swept.orb < swept.dummy ? 'orb' : 'dummy';
      const wallDistance = this.blockingDistance(position, this.direction, length, training);
      if (Number.isFinite(targetDistance) && targetDistance < wallDistance) {
        position.addScaledVector(this.direction, targetDistance);
        this.knifeVisual.rotation.x -= dt * 18 * (1 - targetDistance / Math.max(length, 0.000001));
        this.hitThisThrow = true;
        if (hitKind === 'orb') {
          training.damage(25);
          this.lastHit = 'ORB KNIFE HIT -25';
          this.feedbackUntil = this.clock + 1.5;
        } else {
          this.damageDummy(25, 'KNIFE');
        }
        this.beginKnifeReturn(training);
      } else if (Number.isFinite(wallDistance)) {
        position.addScaledVector(this.direction, Math.max(0, wallDistance - 0.025));
        this.beginKnifeReturn(training);
        this.hitFeedback('wall', position);
        this.lastHit = 'BLOCKED - knife returning';
        this.feedbackUntil = this.clock + 1;
      } else {
        position.addScaledVector(this.direction, length);
        this.distanceTravelled += length;
        if (this.distanceTravelled >= 8.999) this.beginKnifeReturn(training);
      }
    } else if (this.state === 'RETURNING') {
      const source = this.el.is('vr-mode') ? this.right : this.view;
      this.rig.object3D.updateWorldMatrix(true, true);
      source.object3D.getWorldPosition(this.origin);
      this.deltaVector.copy(this.origin).sub(this.knifeRoot.position);
      const distance = this.deltaVector.length();
      const catching = distance <= Math.max(0.15, 14 * dt);
      this.direction.copy(this.deltaVector).normalize();
      this.stepKnifeReturnDamage(this.knifeRoot.position, this.direction, catching ? distance : 14 * dt, training, dt);
      if (catching) {
        this.knifeRoot.visible = false;
        this.state = 'READY';
        this.cooldown = 0.45;
        this.hitFeedback('catch', this.origin);
      } else {
        this.direction.copy(this.deltaVector).normalize();
        this.knifeRoot.position.addScaledVector(this.direction, 14 * dt);
        this.knifeRoot.quaternion.setFromUnitVectors(this.bladeForward, this.direction);
      }
    }
  },

  tick: function (time, delta) {
    if (this.el.components['pause-menu'] && this.el.components['pause-menu'].opened) return;
    if (document.hidden || !delta || delta > 100) return;
    if (this.el.is('vr-mode')) {
      const session = this.el.renderer.xr.getSession();
      if (session && session.visibilityState !== 'visible') { this.cancelKnife(); return; }
    }
    const training = this.el.components['training-v4'];
    if (!training) return;
    const dt = delta / 1000;
    this.clock += dt;
    this.cooldown = Math.max(0, this.cooldown - dt);
    this.updateFeedback(dt);
    const owner = this.el.components['plasma-cutter'];
    const aimValid = this.readAim(this.aimOrigin, this.aimDirection, owner && owner.active ? owner.owningHand : 'right');
    this.updateAimGuide(training, aimValid);
    if (this.throwRequested) {
      this.throwRequested = false;
      this.throwKnife();
    }
    this.stepKnife(dt, training);
    if (this.resetAt && this.clock >= this.resetAt) {
      this.resetAt = 0;
      this.hp = 100;
      this.health.setAttribute('value', 'SUMMIT DUMMY\nHP 100 / 100');
    }
    this.bodyMaterial.color.setHex(this.hp === 0 ? 0xffd54f :
      this.clock < this.flashUntil ? 0xff7043 : 0x26c6da);
    this.view.object3D.getWorldPosition(this.origin);
    this.health.object3D.lookAt(this.origin);

    const climbing = this.el.components['ledge-climb'];
    this.handSamples.forEach(sample => {
      const tracked = training.hands.find(hand => hand.el === sample.el);
      const cutter = this.el.components['plasma-cutter'];
      if (!this.el.is('vr-mode') || !tracked || !tracked.connected ||
          (cutter && cutter.blocksFist(sample.el))) { sample.ready = false; return; }
      const object = sample.el.object3D;
      const local = object.position;
      object.updateWorldMatrix(true, false);
      object.getWorldPosition(this.next);
      this.targetBox.clampPoint(this.next, this.point);
      const contactDistance = this.point.distanceTo(this.next);
      const touching = contactDistance <= 0.10;
      const gripping = climbing && climbing.hands.some(hand => hand.el === sample.el && hand.grabbing);
      if (contactDistance > 0.18) sample.armed = true;
      if (sample.ready && !gripping) {
        // Apply today's parent transform to the previous local sample, excluding
        // rig locomotion/snap turning from the measured physical fist movement.
        this.previousWorld.copy(sample.previous).applyMatrix4(object.parent.matrixWorld);
        this.punchDirection.copy(this.next).sub(this.previousWorld);
        const travel = this.punchDirection.length();
        const speed = local.distanceTo(sample.previous) / dt;
        let swept = this.punchBox.containsPoint(this.previousWorld) || touching;
        if (!swept && travel > 0.00001) {
          this.punchDirection.multiplyScalar(1 / travel);
          swept = Number.isFinite(this.segmentDistance(this.previousWorld,
            this.punchDirection, travel, this.punchBox));
        }
        if (sample.armed && swept && speed >= 0.45 && this.clock >= sample.nextHit && this.hp > 0) {
          this.damageDummy(20, 'PUNCH');
          sample.nextHit = this.clock + 0.35;
          sample.armed = false;
        } else if (touching && this.hints && this.hp > 0 && this.clock >= this.contactHintAt &&
                   this.clock >= sample.nextHit) {
          this.lastHit = 'HAND CONTACT - pull back, then make a small punch';
          this.feedbackUntil = this.clock + 0.8;
          this.contactHintAt = this.clock + 1;
        }
      }
      if (gripping) sample.armed = false;
      sample.previous.copy(local);
      sample.ready = true;
      sample.inside = touching;
    });

    const holding = climbing && climbing.hands.some(hand => hand.grabbing);
    const state = holding ? 'HOLD | Stamina ' + Math.ceil(training.stamina) + '/100 (grip costs 0)' : '';
    const knifeState = this.state === 'READY' && this.cooldown > 0 ? 'RECOVERING' : this.state;
    const cutter = this.el.components['plasma-cutter'];
    let text = 'WRIST LAB v6.2.10 | ' + (cutter && cutter.active ?
      'CUTTER ' + (cutter.owningHand || 'right').toUpperCase() + ' ' + cutter.state + (cutter.ignited ? ' ON' : ' OFF') +
      (cutter.guiding ? ' | TETHER -2/s' : '') +
      (cutter.state !== 'HELD' ? ' | ' + cutter.root.position.distanceTo(cutter.origin).toFixed(1) + 'm' : '') : 'KNIFE ' + knifeState);
    text += ' | STA ' + Math.ceil(training.stamina) + '%';
    if (state) text += '\n' + state;
    if (this.clock < this.feedbackUntil) text += '\n' + this.lastHit;

    if (text !== this.lastStatus) {
      this.status.setAttribute('value', text);
      this.lastStatus = text;
    }
  }
});
</script>


<script>

    const metal = new THREE.MeshStandardMaterial({color: 0x697d90, metalness: 0.7, roughness: 0.3});

    emitter.position.z = -0.13;

    const marker = new THREE.Mesh(new THREE.BoxGeometry(0.016, 0.014, 0.065),
      new THREE.MeshBasicMaterial({color: 0xffba55}));
    marker.position.set(0.043, 0.01, -0.07);
    this.root.add(marker);
    this.ownerMarker = marker;
    const grip = new THREE.Mesh(new THREE.BoxGeometry(0.055, 0.055, 0.12),

    grip.position.z = 0.035;

    this.beam.position.z = -0.15;
    const core = new THREE.Mesh(new THREE.CylinderGeometry(0.013, 0.013, 0.90, 8),
      new THREE.MeshBasicMaterial({color: 0xe8ffff}));
    core.rotation.x = Math.PI / 2;
    core.position.z = -0.45;
    this.beam.add(core);
    const glow = new THREE.Mesh(new THREE.CylinderGeometry(0.035, 0.035, 0.92, 8),
      new THREE.MeshBasicMaterial({color: 0x23ddff, transparent: true, opacity: 0.25, depthWrite: false}));
    glow.rotation.x = Math.PI / 2;
    glow.position.z = -0.45;
    this.beam.add(glow);
    this.root.add(this.beam);
    this.root.visible = false;
    this.el.object3D.add(this.root);
    this.anchorVisual = document.createElement('a-box');
    this.anchorVisual.setAttribute('width',0.30);
    this.anchorVisual.setAttribute('height',0.06);
    this.anchorVisual.setAttribute('depth',0.30);
    this.anchorVisual.setAttribute('color','#53e5c2');
    this.anchorVisual.setAttribute('material',{shader:'flat',opacity:0.65,transparent:true});
    this.anchorVisual.object3D.visible = false;
    this.el.appendChild(this.anchorVisual);
    this.anchorLedge = {x:0,z:0,top:0,width:0.30,depth:0.30,color:'#53e5c2',

      if (Math.abs(x) > 0.45) { this.stickReady = false; return; }
      if (!this.stickReady || Math.abs(x) > 0.25 || Math.abs(y) < 0.78) return;
      this.stickReady = false;
      if (y < 0) this.toggleEquip();
      else this.toggleBlade();

        const menu = this.el.components['pause-menu'];
        if (!this.el.is('vr-mode') || !this.active || hand !== this.owner() || (menu && menu.opened)) return;
        const fx = this.feedback();
        fx.unlockAudio();
        if (!fx.readAim(this.origin, this.aim, this.owningHand)) { if (!this.anchorLive) this.cancel(); return; }
        this.beginPress(); this.primaryAction(this.origin, this.aim);
      });
      hand.addEventListener('triggerup', () => { if (hand === this.owner()) this.endPress(); });
      hand.addEventListener('controllerdisconnected', () => {
        if (hand === this.owner()) { this.cancel(); this.owningHand = 'right'; if (this.ownerMarker) this.ownerMarker.material.color.setHex(0xffba55); }

      });
    });

      if (this.el.is('vr-mode') || event.repeat) return;
      if (event.target.closest && event.target.closest('input,textarea,[contenteditable],button')) return;
      if (event.code === 'KeyC') { event.preventDefault(); this.toggleEquip(); }
      if (event.code === 'KeyV') { event.preventDefault(); this.toggleBlade(); }
      if (event.code === 'KeyO') { event.preventDefault(); this.toggleAnchor(); }
    });
    window.addEventListener('keydown', event => {
      if (this.el.is('vr-mode') || (event.target.closest && event.target.closest('input,textarea,[contenteditable],button'))) return;
      if (['KeyI', 'KeyK', 'KeyJ', 'KeyL'].includes(event.code)) {
        event.preventDefault(); this.controlKeys.add(event.code);

      if (event.code === 'KeyE') this.endPress();

    window.addEventListener('blur', () => this.cancel());
